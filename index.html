<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Flowers For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Playfair+Display:ital,wght@1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#04020c;--night2:#0a0830;--water1:#0e1a45;--water2:#050a1c;--glow:#ff2d55;--lav:#ffd0da;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--night1);overflow:hidden;font-family:"Playfair Display",Georgia,serif;font-style:italic}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 18% 14%,rgba(130,40,170,.38),transparent 55%),radial-gradient(ellipse at 86% 30%,rgba(210,30,90,.24),transparent 50%),radial-gradient(ellipse at 50% 58%,rgba(40,55,170,.32),transparent 60%),linear-gradient(var(--night1),var(--night2) 55%,#0b1233 64%)}
#stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5));pointer-events:none;z-index:7}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--t) ease-in-out var(--d) infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.moon{position:absolute;top:calc(5vh + env(safe-area-inset-top,0px));right:8%;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 62% 38%,rgba(0,0,0,.09) 0 8%,transparent 9%),radial-gradient(circle at 36% 66%,rgba(0,0,0,.08) 0 11%,transparent 12%),radial-gradient(circle at 35% 35%,#fffdf0,#ece3c4 72%);box-shadow:0 0 34px 12px rgba(255,248,224,.32),0 0 90px 30px rgba(255,248,224,.12)}
.water{position:absolute;left:0;right:0;bottom:0;height:36%;background:linear-gradient(var(--water1),var(--water2));overflow:hidden;box-shadow:0 -12px 40px rgba(110,120,230,.25)}
.water::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(150,170,255,.1) 9px 10px);animation:ripple 6s linear infinite}
.water::after{content:"";position:absolute;top:0;right:calc(8% + 8px);width:28px;height:70%;background:linear-gradient(rgba(255,248,224,.35),transparent);filter:blur(6px)}
@keyframes ripple{to{background-position:0 40px}}
.meteor{position:absolute;left:var(--x);top:var(--y);width:120px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;animation:shoot 9s linear var(--d) infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-35deg)}3%{opacity:1}13%,100%{opacity:0;transform:translate(-50vw,34vw) rotate(-35deg)}}

/* intro */
#open{position:absolute;inset:0;width:100%;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent}
#open:focus-visible{outline:3px solid #fff;outline-offset:-8px}
.tap{font:800 clamp(1.8rem,8vw,2.7rem)/1 "Nunito",system-ui,sans-serif;font-style:normal;letter-spacing:.14em;color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--glow),0 0 44px #c40f33;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{text-shadow:0 0 5px #fff,0 0 14px var(--glow),0 0 26px #c40f33}}
.bar{width:64px;height:2px;margin:16px 0 30px;background:#ff5a7a;box-shadow:0 0 10px #ff5a7a}
.heart{width:clamp(120px,36vw,180px);filter:drop-shadow(0 0 22px var(--glow));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.opened #open{pointer-events:none}
.opened .tap,.opened .bar{opacity:0;transition:opacity .5s}
.opened .heart{animation:none;transform:scale(3);opacity:0;transition:transform .9s ease-in,opacity .8s ease-in}

/* show */
#show{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(64px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .9s;z-index:3}
#show.open{opacity:1}
h1{margin:0;text-align:center;font-weight:600;font-size:clamp(2.3rem,10vw,3.6rem);line-height:1.1;background:linear-gradient(100deg,#ff8aa0,#fff0f3 30%,#ff5a76 50%,#fff0f3 70%,#ff8aa0);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(255,45,85,.7))}
.for{font:400 clamp(1.9rem,8vw,2.7rem)/1 "Great Vibes","Brush Script MT",cursive;font-style:normal;color:#ffc2cf;text-shadow:0 0 14px rgba(255,45,85,.8);margin-top:-6px;text-align:center}
.open .for{animation:fade 1.5s 1.4s backwards}
.open h1{animation:title 2s ease-out .2s backwards,shine 6s linear 2.2s infinite}
@keyframes shine{to{background-position:-250% 0}}
@keyframes title{from{opacity:0;letter-spacing:.3em;filter:blur(8px)}}
svg.b{height:min(38vh,400px);width:auto;max-width:92vw;overflow:visible;transform-origin:50% 100%;filter:drop-shadow(0 0 10px rgba(255,45,85,.5));animation:float 6s ease-in-out infinite,glow 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-6px) rotate(1.2deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 20px rgba(255,70,100,.8))}}
.st{fill:none;stroke:#58b36b;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1}
.open .st{animation:draw 1.3s ease-out var(--d) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.hd,.lf{transform-origin:0 30px}
.lf{transform-origin:200px 396px}
.open .hd{animation:bud 1s cubic-bezier(.3,1.5,.5,1) calc(var(--d) + 1.1s) backwards}
.open .lf{animation:bud .9s ease-out var(--d) backwards}
@keyframes bud{from{transform:scale(0)}}
.bl{transform:rotate(-10deg);transform-origin:0 30px}
.br{transform:rotate(10deg);transform-origin:0 30px}
.open .bl{animation:openL 1.5s ease-out calc(var(--d) + 1.5s) backwards}
.open .br{animation:openR 1.5s ease-out calc(var(--d) + 1.5s) backwards}
@keyframes openL{from{transform:rotate(2deg)}}
@keyframes openR{from{transform:rotate(-2deg)}}
.open .cone{animation:fade 1s .1s backwards}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.sk{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffc2cf;box-shadow:0 0 10px 3px var(--glow);animation:rise var(--t) ease-in-out var(--d) infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0)}30%,70%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
.lf2,.fn{transform-origin:0 0}
.open .lf2{animation:bud .8s ease-out var(--d) backwards}
.open .fn{animation:bud 1s ease-out 1.4s backwards}
#rain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity 1.5s}
.opened #rain{opacity:1;transition-delay:1.6s}
.fr{position:absolute;top:-40px;left:var(--x);animation:frfall var(--t) linear var(--d) infinite}
.fr svg{width:var(--s);height:var(--s);display:block;opacity:.85;animation:frsway var(--w) ease-in-out infinite alternate}
@keyframes frfall{to{transform:translateY(calc(100vh + 80px))}}
@keyframes frsway{from{transform:translateX(-16px) rotate(-25deg)}to{transform:translateX(16px) rotate(25deg)}}
#show::before{content:"";position:absolute;left:50%;top:48%;width:min(120vw,720px);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,45,85,.28),rgba(200,20,70,.1) 45%,transparent 68%);animation:halo 5s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes halo{50%{opacity:.6;transform:translate(-50%,-50%) scale(1.08)}}
.hw{position:relative;display:grid;place-items:center}
.hw::before,.hw::after{content:"";position:absolute;width:100%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,45,85,.6);animation:ring 2.6s ease-out infinite}
.hw::after{animation-delay:1.3s}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(2.2);opacity:0}}
.opened .hw::before,.opened .hw::after{display:none}
#bokeh{position:absolute;inset:0;pointer-events:none}
.bk{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,90,120,.28),transparent 70%);animation:bkm var(--t) ease-in-out infinite alternate}
@keyframes bkm{to{transform:translate(var(--x),var(--y)) scale(1.2);opacity:.5}}
.dock{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.pill{font:600 .92rem "Playfair Display",serif;font-style:italic;color:var(--lav);background:#ffffff14;border:1px solid #ffffff30;border-radius:999px;padding:5px 14px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,transform .2s}
.pill:hover{background:#ffffff26;transform:translateY(-2px)}
.pill:focus-visible{outline:3px solid #fff;outline-offset:3px}
.open .pill{pointer-events:auto}
.pill[aria-pressed="true"]{background:rgba(255,45,85,.3);border-color:rgba(255,120,140,.7)}
#letter{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,2,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .5s both}
#letter[hidden]{display:none}
.paper{position:relative;width:min(92vw,520px);max-height:78vh;overflow:auto;padding:30px 26px 26px;border-radius:24px;color:#ffe6ec;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,45,85,.1));border:1px solid rgba(255,160,180,.4);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,45,85,.2)}
.paper h2{margin:0 0 10px;font:400 2.3rem "Great Vibes",cursive;font-style:normal;color:#ffc2cf;text-align:center;text-shadow:0 0 12px rgba(255,45,85,.7)}
#lt{white-space:pre-wrap;line-height:1.75;font-size:1.05rem}
.x{position:absolute;top:8px;right:12px;background:none;border:0;color:#ffc2cf;font-size:1.8rem;line-height:1;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(14vh + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:15;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--lav);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .6s;white-space:nowrap;font-size:1rem}
#toast.on{opacity:1}
.wst{position:absolute;left:78%;top:10%;width:170px;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff,rgba(255,200,215,.6),transparent);box-shadow:0 0 14px 3px rgba(255,220,230,.7);z-index:6;animation:wish 2s ease-in forwards}
@keyframes wish{from{opacity:1;transform:translate(0,0) rotate(-30deg)}to{opacity:0;transform:translate(-75vw,44vw) rotate(-30deg)}}
.bs{position:absolute;z-index:8;width:22px;height:20px;margin:-10px 0 0 -11px;pointer-events:none;animation:burst 1.3s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}}
.fr.big svg{filter:blur(3px);opacity:.3}
#stars,#bokeh{transition:transform .4s ease-out;transform:translate(calc(var(--mx,0)*-12px),calc(var(--my,0)*-8px))}
.msg{position:relative;width:min(92vw,540px);min-height:7.6em;display:grid;place-items:center;padding:22px 22px 30px;text-align:center;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,45,85,.08));border:1px solid rgba(255,170,190,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 36px rgba(0,0,0,.4),0 0 40px rgba(255,45,85,.14),inset 0 0 24px rgba(255,45,85,.08)}
.msg::before{content:"♥";position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:30px;height:30px;display:grid;place-items:center;font-style:normal;font-size:1.1rem;color:#ff4d6d;text-shadow:0 0 14px #ff2d55;background:#1a0c24;border-radius:50%;border:1px solid rgba(255,170,190,.4);animation:beat2 1.8s ease-in-out infinite}
@keyframes beat2{50%{transform:translateX(-50%) scale(1.18)}}
.ml{font:600 clamp(1.3rem,5.6vw,1.8rem)/1.35 "Playfair Display",serif;font-style:italic;color:#fff4f7;text-shadow:0 0 12px rgba(255,90,120,.85),0 0 30px rgba(255,45,85,.45)}
.ml.sig{font:400 clamp(2rem,8.4vw,2.8rem)/1.2 "Great Vibes","Brush Script MT",cursive;font-style:normal}
.w{display:inline-block;opacity:0;animation:wi .8s cubic-bezier(.2,.9,.3,1) calc(var(--i)*.14s) forwards}
@keyframes wi{from{opacity:0;transform:translateY(14px) scale(.9);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ml.out{animation:lo .65s ease-in forwards}
@keyframes lo{to{opacity:0;transform:translateY(-8px);filter:blur(4px)}}
.dots{position:absolute;left:0;right:0;bottom:11px;display:flex;gap:7px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .4s,transform .4s}
.dots i.on{background:#ff6b88;box-shadow:0 0 8px #ff2d55;transform:scale(1.4)}
#petals{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,2,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .5s both}
#petals[hidden]{display:none}
.pp{position:relative;width:min(92vw,460px);padding:28px 22px 24px;text-align:center;border-radius:24px;color:#ffe6ec;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,45,85,.1));border:1px solid rgba(255,160,180,.4);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,45,85,.2)}
.pp h2{margin:0 0 6px;font:400 2.3rem "Great Vibes",cursive;font-style:normal;color:#ffc2cf;text-shadow:0 0 12px rgba(255,45,85,.7)}
#bl{width:min(58vw,230px);height:auto;display:block;margin:0 auto;cursor:pointer;overflow:visible;filter:drop-shadow(0 0 16px rgba(255,45,85,.5));animation:float 6s ease-in-out infinite}
#bl:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:50%}
.pt{transform-origin:100px 100px}
.pt.fall{animation:pf 1.5s ease-in forwards}
@keyframes pf{to{translate:var(--fx) 230px;rotate:var(--fr);opacity:0}}
.pr{min-height:4.2em;margin:14px 0 6px;font:600 1.2rem/1.45 "Playfair Display",serif;font-style:italic;text-shadow:0 0 12px rgba(255,90,120,.7)}
.pr.sw{animation:fade .6s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.meteor,.sk,.fr,.bk,.bs,.wst{display:none}.w{opacity:1}.pt.fall{opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="bokeh"></div>
  <div class="moon"></div>
  <div class="meteor" style="--x:72%;--y:6%;--d:2s"></div>
  <div class="meteor" style="--x:95%;--y:18%;--d:6.5s"></div>
  <div class="meteor" style="--x:88%;--y:30%;--d:11s"></div>
  <div class="water"></div>

  <div id="rain"></div>
  <button id="open" aria-label="Tap to open">
    <span class="tap">TAP TO OPEN</span>
    <span class="bar"></span>
    <span class="hw"><svg class="heart" viewBox="0 0 100 90" aria-hidden="true">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b81"/><stop offset="1" stop-color="#c4102f"/></linearGradient></defs>
      <path d="M50 86C10 56 2 36 10 20 18 4 40 6 50 24 60 6 82 4 90 20 98 36 90 56 50 86Z" fill="url(#hg)"/>
      <ellipse cx="29" cy="25" rx="9" ry="5.5" fill="#fff" fill-opacity=".55" transform="rotate(-35 29 25)"/>
    </svg></span>
  </button>

  <div id="show">
    <h1>Flowers For You</h1>
    <div class="for">Archana ♥</div>
    <svg class="b" id="bq" viewBox="0 0 400 460" aria-label="A bouquet of glowing red tulips"></svg>
    <div class="msg" aria-live="polite"><div class="ml" id="ml"></div><div class="dots" id="dots"></div></div>
    <div id="sparks"></div>
    <div class="dock">
      <button class="pill" id="letterBtn">💌 Letter</button>
      <button class="pill" id="wishBtn">✦ Wish</button>
      <button class="pill" id="petalBtn">🌸 Petals</button>
      <button class="pill" id="replay">↺ Replay</button>
    </div>
  </div>
</div>

<div id="letter" role="dialog" aria-modal="true" aria-label="Love letter" hidden>
  <div class="paper"><button class="x" id="lx" aria-label="Close letter">×</button><h2>For Archana</h2><div id="lt"></div></div>
</div>
<div id="petals" role="dialog" aria-modal="true" aria-label="Pluck a petal" hidden>
  <div class="pp">
    <button class="x" id="px" aria-label="Close">×</button>
    <h2>Pluck a petal</h2>
    <svg id="bl" viewBox="0 0 200 200" tabindex="0" role="button" aria-label="Flower with twelve petals. Tap to pluck a petal."></svg>
    <p id="pr" class="pr"></p>
    <button class="pill" id="pnew" hidden>Grow a new flower</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
  function rnd(a,b){return a+Math.random()*(b-a)}
  var i,out='',W=window.innerWidth;
  for(i=0;i<(W<600?70:120);i++){var s=rnd(1,2.8).toFixed(1);out+='<i class="star" style="left:'+rnd(0,100).toFixed(1)+'%;top:'+rnd(0,64).toFixed(1)+'%;width:'+s+'px;height:'+s+'px;--t:'+rnd(2,5).toFixed(1)+'s;--d:-'+rnd(0,5).toFixed(1)+'s"></i>'}
  document.getElementById('stars').innerHTML=out;

  var defs='<defs>'+
   '<radialGradient id="pf" cx=".38" cy=".32" r=".85"><stop offset="0" stop-color="#ff8a98"/><stop offset=".55" stop-color="#e0112f"/><stop offset="1" stop-color="#8f0a22"/></radialGradient>'+
   '<linearGradient id="pm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3152f"/><stop offset="1" stop-color="#6e0a1c"/></linearGradient>'+
   '<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f9a5a"/><stop offset="1" stop-color="#86e29e"/></linearGradient>'+
   '<linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8506c"/><stop offset="1" stop-color="#7a1230"/></linearGradient></defs>';
  function fern(ox,oy,ang,len){
    var s='<path d="M0,0Q'+(len*.12)+','+(-len/2)+' 0,'+(-len)+'" stroke="#4fae6a" stroke-width="2" fill="none" stroke-linecap="round"/>';
    for(var j=1;j<=9;j++){var y=-j*len/10,w=15*(1-j/11)+3;
      s+='<path d="M0,'+y+'L'+(-w)+','+(y-7)+'M0,'+y+'L'+w+','+(y-7)+'" stroke="#58b36b" stroke-width="2.4" stroke-linecap="round" fill="none"/>';}
    return '<g transform="translate('+ox+' '+oy+') rotate('+ang+')"><g class="fn">'+s+'</g></g>';
  }
  var F=[[196,54,1.2],[130,72,1.1],[266,66,1.15],[78,112,1.05],[330,106,1.05],[165,100,1.1],[232,96,1.1],[48,172,1],[356,166,1],[112,150,1.05],[290,146,1.05],[200,140,1.15],[140,200,1],[262,196,1]];
  var stems='',heads='',leaves='';
  F.forEach(function(f,k){
    var x=f[0],y=f[1],sc=f[2],ex=x,ey=y+30*sc,cx=200+(x-200)*.46+(k%2?5:-5),cy=392-(392-ey)*.5;
    var a=Math.atan2(ex-cx,cy-ey)*180/Math.PI,d=(.5+k*.3).toFixed(2);
    stems+='<path class="st" pathLength="1" style="--d:'+d+'s" d="M200,392Q'+cx.toFixed(0)+','+cy.toFixed(0)+' '+ex+','+ey.toFixed(0)+'"/>';
    [[.36,k%2?1:-1],[.62,k%2?-1:1]].forEach(function(l){
      var t=l[0],u=1-t,px=u*u*200+2*u*t*cx+t*t*ex,py=u*u*392+2*u*t*cy+t*t*ey,th=-90+a+l[1]*55;
      leaves+='<g transform="translate('+px.toFixed(0)+' '+py.toFixed(0)+') rotate('+th.toFixed(0)+') scale(1.15)"><g class="lf2" style="--d:'+(+d+.8+t).toFixed(2)+'s"><path d="M0,0C10,-9 32,-9 48,0 32,9 10,9 0,0Z" fill="url(#lg)"/><path d="M3,0L42,0" stroke="#1f6b3a" stroke-opacity=".45" stroke-width="1.2" fill="none"/></g></g>';
    });
    heads+='<g transform="translate('+ex+' '+ey.toFixed(0)+') rotate('+a.toFixed(1)+') scale('+sc+') translate(0 -30)" style="--d:'+d+'s"><g class="hd">'+
      '<path class="bl" d="M-26,-14C-30,6 -24,30 -4,31 -10,12 -9,-10 -10,-30 -16,-32 -24,-26 -26,-14Z" fill="url(#pm)"/>'+
      '<path class="br" d="M26,-14C30,6 24,30 4,31 10,12 9,-10 10,-30 16,-32 24,-26 26,-14Z" fill="url(#pm)"/>'+
      '<path d="M0,31C-16,29 -20,6 -17,-12 -15,-24 -8,-31 0,-32 8,-31 15,-24 17,-12 20,6 16,29 0,31Z" fill="url(#pf)"/>'+
      '<path d="M-8,-29C-11,-10 -9,12 -4,28M8,-29C11,-10 9,12 4,28" stroke="#5a0716" stroke-opacity=".4" stroke-width="1.5" fill="none" stroke-linecap="round"/>'+
      '<ellipse cx="-9" cy="-6" rx="3.6" ry="12" fill="#fff" fill-opacity=".5" transform="rotate(8 -9 -6)"/></g></g>';
  });
  var cone='<g class="cone"><path d="M118,330Q200,312 282,330L216,456Q200,462 184,456Z" fill="url(#pw)" fill-opacity=".94"/>'+
    '<path d="M282,330L216,456 198,458Q248,400 282,330Z" fill="#3a0014" fill-opacity=".35"/>'+
    '<path d="M118,330Q150,400 188,458L198,458Q172,390 148,334Z" fill="#fff" fill-opacity=".16"/>'+
    '<path d="M160,340L196,452M240,340L206,452" stroke="#fff" stroke-opacity=".18" stroke-width="1.5" fill="none"/>'+
    '<path d="M118,330Q200,312 282,330" fill="none" stroke="#ffb3c2" stroke-opacity=".6" stroke-width="3"/>'+
    '<path d="M200,410C172,390 152,408 170,423 182,431 196,420 200,410Z M200,410C228,390 248,408 230,423 218,431 204,420 200,410Z" fill="#ffd166"/><circle cx="200" cy="412" r="6" fill="#ffe9a8"/></g>'+
    fern(150,438,-68,64)+fern(162,446,-36,56)+fern(250,438,68,64)+fern(238,446,36,56);
  document.getElementById('bq').innerHTML=defs+stems+leaves+cone+heads;

  out='';
  for(i=0;i<30;i++)out+='<i class="sk" style="left:'+rnd(14,86).toFixed(0)+'%;top:'+rnd(28,78).toFixed(0)+'%;--t:'+rnd(3,6).toFixed(1)+'s;--d:'+rnd(3,9).toFixed(1)+'s"></i>';
  document.getElementById('sparks').innerHTML=out;

  var rc=['#ff5a76','#ff8fa3','#e0112f','#ffc2cf','#ff7a90'],rain='';
  for(i=0;i<(W<600?34:60);i++){
    var c=rc[Math.floor(Math.random()*rc.length)],sz=rnd(14,26).toFixed(0),b='';
    if(Math.random()<.65){for(var q=0;q<5;q++){var an=q*72*Math.PI/180;b+='<circle cx="'+(20+11*Math.sin(an)).toFixed(1)+'" cy="'+(20-11*Math.cos(an)).toFixed(1)+'" r="8.5" fill="'+c+'"/>'}b+='<circle cx="20" cy="20" r="5" fill="#ffd166"/>'}
    else b='<path d="M20,4C34,14 34,30 20,38 6,30 6,14 20,4Z" fill="'+c+'"/>';
    rain+='<div class="fr" style="--x:'+rnd(0,98).toFixed(1)+'%;--s:'+sz+'px;--t:'+rnd(11,18).toFixed(1)+'s;--d:-'+rnd(0,16).toFixed(1)+'s;--w:'+rnd(2.5,4.5).toFixed(1)+'s"><svg viewBox="0 0 40 40" aria-hidden="true">'+b+'</svg></div>';
  }
  for(i=0;i<6;i++){var bc=rc[Math.floor(Math.random()*rc.length)];rain+='<div class="fr big" style="--x:'+rnd(0,96).toFixed(0)+'%;--s:'+rnd(60,110).toFixed(0)+'px;--t:'+rnd(16,24).toFixed(0)+'s;--d:-'+rnd(0,20).toFixed(0)+'s;--w:'+rnd(4,6).toFixed(1)+'s"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20,4C34,14 34,30 20,38 6,30 6,14 20,4Z" fill="'+bc+'"/></svg></div>'}
  document.getElementById('rain').innerHTML=rain;
  var bk='';
  for(i=0;i<9;i++){var bs=rnd(70,160).toFixed(0);bk+='<i class="bk" style="left:'+rnd(-5,95).toFixed(0)+'%;top:'+rnd(5,80).toFixed(0)+'%;width:'+bs+'px;height:'+bs+'px;--t:'+rnd(7,13).toFixed(0)+'s;--x:'+rnd(-40,40).toFixed(0)+'px;--y:'+rnd(-40,40).toFixed(0)+'px"></i>'}
  document.getElementById('bokeh').innerHTML=bk;

  var stage=document.getElementById('stage'),show=document.getElementById('show');
  document.getElementById('open').addEventListener('click',function(){
    stage.classList.add('opened');
    setTimeout(function(){show.classList.add('open')},650);
  });
  document.getElementById('replay').addEventListener('click',function(){
    show.classList.remove('open');stage.classList.remove('opened');
  });

  var LETTER='My dearest Archana,\n\nI made this little garden because words alone didn’t feel like enough. Every flower in it is a small piece of what I feel when I think of you.\n\nYou make my days softer, my smile bigger and my world brighter. Thank you for laughing with me, for caring about me, and for being exactly who you are.\n\nI don’t know everything the future holds, but I know I want it to have you in it.\n\nAlways yours,\nSubash ❤';
  var lt=document.getElementById('lt'),lw=document.getElementById('letter'),paper=lw.querySelector('.paper'),tm=null;
  function openLetter(){lw.hidden=false;var n=0;clearInterval(tm);lt.textContent='';tm=setInterval(function(){n++;lt.textContent=LETTER.slice(0,n);paper.scrollTop=paper.scrollHeight;if(n>=LETTER.length)clearInterval(tm)},26);document.getElementById('lx').focus()}
  function closeLetter(){clearInterval(tm);lw.hidden=true}
  document.getElementById('letterBtn').addEventListener('click',openLetter);
  document.getElementById('lx').addEventListener('click',closeLetter);
  paper.addEventListener('click',function(e){if(e.target.id!=='lx'){clearInterval(tm);lt.textContent=LETTER}});
  lw.addEventListener('click',function(e){if(e.target===lw)closeLetter()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLetter()});


  var toast=document.getElementById('toast'),tt=null;
  document.getElementById('wishBtn').addEventListener('click',function(){
    var w=document.createElement('div');w.className='wst';stage.appendChild(w);setTimeout(function(){w.remove()},2200);
    toast.textContent='Close your eyes and make a wish ✨';toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},3400);
  });

  stage.addEventListener('pointerdown',function(e){
    if(!stage.classList.contains('opened')||e.target.closest('button'))return;
    var C=['#ff5a76','#ff8fa3','#ffc2cf','#e0112f'];
    for(var q=0;q<9;q++){
      var el=document.createElement('div'),ang=Math.random()*6.283,r=rnd(50,120);
      el.className='bs';el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';
      el.style.setProperty('--dx',(Math.cos(ang)*r).toFixed(0)+'px');el.style.setProperty('--dy',(Math.sin(ang)*r-30).toFixed(0)+'px');el.style.setProperty('--r',rnd(-90,90).toFixed(0)+'deg');
      el.innerHTML='<svg viewBox="0 0 100 90" width="22" height="20" aria-hidden="true"><path d="M50 86C10 56 2 36 10 20 18 4 40 6 50 24 60 6 82 4 90 20 98 36 90 56 50 86Z" fill="'+C[q%4]+'"/></svg>';
      stage.appendChild(el);
      setTimeout((function(n){return function(){n.remove()}})(el),1400);
    }
  });
  stage.addEventListener('pointermove',function(e){stage.style.setProperty('--mx',(e.clientX/window.innerWidth-.5).toFixed(2));stage.style.setProperty('--my',(e.clientY/window.innerHeight-.5).toFixed(2))});

  var LINES=['Every flower here is for you, Archana.','You are the calm in my busiest days.','Your smile is my favourite place to rest.','With you, even ordinary moments bloom.','If love were a garden, you’d be every flower in it.','I hope this garden makes you smile as much as you make me smile.','I’m so glad it’s you. — Subash'];
  var ml=document.getElementById('ml'),dots=document.getElementById('dots'),li=0,seqT=null,startT=null;
  dots.innerHTML=LINES.map(function(){return '<i></i>'}).join('');
  function showLine(){
    var ws=LINES[li].split(' ');
    ml.className='ml'+(li===LINES.length-1?' sig':'');
    ml.innerHTML=ws.map(function(w,k){return '<span class="w" style="--i:'+k+'">'+w+'</span>'}).join(' ');
    [].forEach.call(dots.children,function(d,k){d.className=k===li?'on':''});
    seqT=setTimeout(function(){ml.classList.add('out');seqT=setTimeout(function(){li=(li+1)%LINES.length;showLine()},650)},ws.length*140+700+2600);
  }
  function stopLines(){clearTimeout(startT);clearTimeout(seqT);ml.innerHTML='';ml.className='ml'}
  document.getElementById('open').addEventListener('click',function(){stopLines();startT=setTimeout(function(){li=0;showLine()},5200)});
  document.getElementById('replay').addEventListener('click',stopLines);

  var REASONS=['Your smile lights up my whole day.','You laugh in the cutest way.','You make ordinary days feel special.','You are kind to everyone around you.','You listen to me like I matter.','You make me want to be better.','Your voice is my favourite sound.','You turn bad days into better ones.','You’re beautiful inside and out.','Being with you feels like home.','You make me laugh when I need it most.','You are simply you, and that is my favourite thing.'];
  var FINAL='That’s twelve petals, and I could keep going. Thank you for being you, Archana ❤';
  var pw=document.getElementById('petals'),bl=document.getElementById('bl'),pr=document.getElementById('pr'),pnew=document.getElementById('pnew'),pn=0;
  function say(t){pr.textContent=t;pr.classList.remove('sw');void pr.offsetWidth;pr.classList.add('sw')}
  function growFlower(){
    var h='';
    for(var k=0;k<12;k++)h+='<g class="pt" transform="rotate('+(k*30)+' 100 100)"><ellipse cx="100" cy="52" rx="17" ry="38" fill="'+(k%2?'#ff8fa3':'#ff5a76')+'"/></g>';
    h+='<circle cx="100" cy="100" r="22" fill="#ffd166"/><circle cx="100" cy="100" r="15" fill="none" stroke="#ff9f1c" stroke-opacity=".55" stroke-width="3" stroke-dasharray="2 5"/>';
    bl.innerHTML=h;pn=0;pnew.hidden=true;say('Tap the flower to pluck a petal 🌸');
  }
  function pluck(){
    if(pn>=12)return;
    var el=bl.querySelectorAll('.pt')[pn];
    el.style.setProperty('--fx',(Math.random()*120-60).toFixed(0)+'px');
    el.style.setProperty('--fr',(Math.random()*160-80).toFixed(0)+'deg');
    el.classList.add('fall');
    say(REASONS[pn]);pn++;
    if(pn===12)setTimeout(function(){say(FINAL);pnew.hidden=false},3400);
  }
  function closePetals(){pw.hidden=true}
  growFlower();
  document.getElementById('petalBtn').addEventListener('click',function(){pw.hidden=false;bl.focus()});
  bl.addEventListener('click',pluck);
  bl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pluck()}});
  pnew.addEventListener('click',growFlower);
  document.getElementById('px').addEventListener('click',closePetals);
  pw.addEventListener('click',function(e){if(e.target===pw)closePetals()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closePetals()});
})();
</script>
</body>
</html>
